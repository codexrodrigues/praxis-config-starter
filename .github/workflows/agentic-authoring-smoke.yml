name: Agentic Authoring HTTP Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider used by the quickstart HTTP smoke.'
        required: true
        default: openai
        type: choice
        options:
          - openai
          - gemini
      openai_model:
        description: 'Optional OpenAI model override for this smoke run.'
        required: false
        default: ''
        type: string
      gemini_model:
        description: 'Optional Gemini model override for this smoke run.'
        required: false
        default: ''
        type: string
      quickstart_ref:
        description: 'Immutable praxis-api-quickstart commit SHA to test against.'
        required: true
        default: cbc5cec318a77e998e786e486861a3c92727519e
        type: string
      metadata_ref:
        description: 'Immutable praxis-metadata-starter commit SHA to install locally.'
        required: true
        default: 567b35bce2fa229bb06c5662c57fc96902e04f09
        type: string
      ui_ref:
        description: 'Immutable praxis-ui-angular commit SHA used by the page-builder E2E gate.'
        required: true
        default: 2ec8ff6c0c83cc3e284ff1c19e05d6ec72224b44
        type: string
      run_page_builder_full_e2e:
        description: 'Run the page-builder agentic Playwright gate after the HTTP/SSE smoke.'
        required: false
        default: false
        type: boolean
      page_builder_e2e_mode:
        description: 'Page Builder browser gate depth. Use smoke for release gate, full for deliberate matrix investigation.'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      page_builder_e2e_timeout_minutes:
        description: 'Timeout for the Page Builder Playwright gate step.'
        required: false
        default: '30'
        type: string
      run_quickstart_http_smoke:
        description: 'Run the quickstart agentic authoring HTTP/SSE smoke.'
        required: false
        default: true
        type: boolean
      domain_rule_lifecycle_only:
        description: 'Run only the deterministic domain-rule HTTP lifecycle, without external LLM or embedding calls.'
        required: false
        default: false
        type: boolean
      run_domain_catalog_v2_smoke:
        description: 'Run the quickstart Domain Catalog v2 HTTP smoke.'
        required: false
        default: true
        type: boolean
      run_llm_compliance_policy_shadow:
        description: 'Run the external LLM compliance-policy shadow test against the selected provider.'
        required: false
        default: false
        type: boolean
      fail_llm_compliance_on_provider_unavailable:
        description: 'Fail the compliance-policy shadow when the selected provider is unavailable or quota-limited.'
        required: false
        default: false
        type: boolean
      quickstart_startup_timeout_seconds:
        description: 'Quickstart startup timeout used by HTTP smoke, domain catalog smoke and page-builder E2E.'
        required: false
        default: '180'
        type: string
      page_builder_ui_startup_timeout_seconds:
        description: 'Angular dev server startup timeout used by the page-builder E2E gate.'
        required: false
        default: '600'
        type: string

concurrency:
  group: agentic-authoring-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quickstart-http-smoke:
    name: Quickstart HTTP/SSE smoke and optional page-builder E2E
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PRAXIS_AI_OPENAI_API_KEY: ${{ secrets.PRAXIS_AI_OPENAI_API_KEY }}
      PRAXIS_AI_OPENAI_MODEL: ${{ inputs.openai_model || vars.PRAXIS_AI_OPENAI_MODEL || 'gpt-4.1-mini' }}
      PRAXIS_AI_GEMINI_API_KEY: ${{ secrets.PRAXIS_AI_GEMINI_API_KEY }}
      PRAXIS_AI_GEMINI_MODEL: ${{ inputs.gemini_model || vars.PRAXIS_AI_GEMINI_MODEL || 'gemini-2.5-flash' }}
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      CONFIG_DATASOURCE_URL: ${{ secrets.CONFIG_DATASOURCE_URL }}
      CONFIG_DATASOURCE_USERNAME: ${{ secrets.CONFIG_DATASOURCE_USERNAME }}
      CONFIG_DATASOURCE_PASSWORD: ${{ secrets.CONFIG_DATASOURCE_PASSWORD }}
    steps:
      - name: Checkout praxis-config-starter
        uses: actions/checkout@v5
        with:
          path: praxis-config-starter

      - name: Validate immutable refs and load canonical gate matrix
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $refs = @{
            quickstart = '${{ inputs.quickstart_ref }}'
            metadata = '${{ inputs.metadata_ref }}'
            ui = '${{ inputs.ui_ref }}'
          }
          foreach ($entry in $refs.GetEnumerator()) {
            if ($entry.Value -notmatch '^[0-9a-fA-F]{40}$') {
              throw "$($entry.Key) ref must be an immutable 40-character commit SHA."
            }
          }
          $matrix = Get-Content -LiteralPath tools/e2e/page-builder-agentic-gate-matrix.json -Raw | ConvertFrom-Json
          "PB_STREAM_PROCESSING_TIMEOUT_SECONDS=$($matrix.defaults.streamProcessingTimeoutSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout praxis-api-quickstart
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-api-quickstart
          ref: ${{ inputs.quickstart_ref }}
          path: praxis-api-quickstart
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Checkout praxis-metadata-starter
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-metadata-starter
          ref: ${{ inputs.metadata_ref }}
          path: praxis-metadata-starter
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Checkout praxis-ui-angular
        if: inputs.run_page_builder_full_e2e == true
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-ui-angular
          ref: ${{ inputs.ui_ref }}
          path: praxis-ui-angular
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 20
        if: inputs.run_page_builder_full_e2e == true
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: praxis-ui-angular/package-lock.json

      - name: Prepare Quickstart runtime secret
        shell: pwsh
        run: |
          $etagSecretBytes = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $etagSecret = [Convert]::ToHexString($etagSecretBytes)
          Write-Output "::add-mask::$etagSecret"
          "PRAXIS_RESOURCE_VERSION_ETAG_SECRET=$etagSecret" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare AI env file
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          function Escape-PsSingleQuoted([string] $Value) {
            if ($null -eq $Value) {
              return ''
            }
            return $Value.Replace("'", "''")
          }
          $provider = '${{ inputs.provider }}'
          $domainRuleLifecycleOnly = '${{ inputs.domain_rule_lifecycle_only }}' -eq 'true'
          if (-not $domainRuleLifecycleOnly -and $provider -eq 'openai' -and [string]::IsNullOrWhiteSpace($env:PRAXIS_AI_OPENAI_API_KEY)) {
            throw 'Missing required secret PRAXIS_AI_OPENAI_API_KEY for provider=openai.'
          }
          if (-not $domainRuleLifecycleOnly -and $provider -eq 'gemini' -and [string]::IsNullOrWhiteSpace($env:PRAXIS_AI_GEMINI_API_KEY)) {
            throw 'Missing required secret PRAXIS_AI_GEMINI_API_KEY for provider=gemini.'
          }
          @"
          `$env:PRAXIS_AI_OPENAI_API_KEY = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_OPENAI_API_KEY)'
          `$env:PRAXIS_AI_OPENAI_MODEL = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_OPENAI_MODEL)'
          `$env:PRAXIS_AI_GEMINI_API_KEY = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_GEMINI_API_KEY)'
          `$env:PRAXIS_AI_GEMINI_MODEL = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_GEMINI_MODEL)'
          "@ | Set-Content -LiteralPath .env.openai.local.ps1 -Encoding UTF8

      - name: Resolve quickstart starter versions
        shell: pwsh
        working-directory: praxis-api-quickstart
        run: |
          $configVersion = mvn -q -DforceStdout help:evaluate "-Dexpression=praxis.config.version"
          if ([string]::IsNullOrWhiteSpace($configVersion)) {
            throw 'Could not resolve praxis-api-quickstart praxis.config.version.'
          }
          $metadataVersion = mvn -q -DforceStdout help:evaluate "-Dexpression=praxis.core.version"
          if ([string]::IsNullOrWhiteSpace($metadataVersion)) {
            throw 'Could not resolve praxis-api-quickstart praxis.core.version.'
          }
          "STARTER_VERSION=$configVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "METADATA_STARTER_VERSION=$metadataVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install praxis-metadata-starter locally
        shell: pwsh
        working-directory: praxis-metadata-starter
        run: |
          mvn -q versions:set "-DnewVersion=$env:METADATA_STARTER_VERSION" -DgenerateBackupPoms=false
          mvn -B -DskipTests install

      - name: Install praxis-config-starter locally
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          mvn -q versions:set "-DnewVersion=$env:STARTER_VERSION" -DgenerateBackupPoms=false
          mvn -B -DskipTests install

      - name: Package praxis-api-quickstart against local starter
        shell: pwsh
        working-directory: praxis-api-quickstart
        run: mvn -B -DskipTests "-Dpraxis.core.version=$env:METADATA_STARTER_VERSION" "-Dpraxis.config.version=$env:STARTER_VERSION" package

      - name: Install praxis-ui-angular dependencies
        if: inputs.run_page_builder_full_e2e == true
        shell: pwsh
        working-directory: praxis-ui-angular
        run: npm ci --no-audit --fund=false

      - name: Install Playwright Chromium
        if: inputs.run_page_builder_full_e2e == true
        shell: pwsh
        working-directory: praxis-ui-angular
        run: npx playwright install chromium

      - name: Run quickstart authoring HTTP/SSE smoke suite
        if: inputs.run_quickstart_http_smoke == true
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $smokeArgs = @{
            Provider = '${{ inputs.provider }}'
            JavaHome = "$env:JAVA_HOME"
            QuickstartRoot = "$env:GITHUB_WORKSPACE\praxis-api-quickstart"
            EnvFile = "$env:GITHUB_WORKSPACE\praxis-config-starter\.env.openai.local.ps1"
            StartupTimeoutSec = [int]'${{ inputs.quickstart_startup_timeout_seconds }}'
            StreamProcessingTimeoutSeconds = [int]$env:PB_STREAM_PROCESSING_TIMEOUT_SECONDS
          }
          if ('${{ inputs.domain_rule_lifecycle_only }}' -eq 'true') {
            $smokeArgs.DomainRuleLifecycleOnly = $true
          }
          .\tools\Invoke-QuickstartAgenticAuthoringHttpSmokeSuite.ps1 @smokeArgs

      - name: Run quickstart Domain Catalog v2 HTTP smoke
        if: inputs.run_domain_catalog_v2_smoke == true
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          .\tools\Invoke-QuickstartDomainCatalogV2HttpSmoke.ps1 `
            -JavaHome "$env:JAVA_HOME" `
            -QuickstartRoot "$env:GITHUB_WORKSPACE\praxis-api-quickstart" `
            -StartupTimeoutSec ([int]'${{ inputs.quickstart_startup_timeout_seconds }}')

      - name: Run LLM compliance-policy shadow
        if: inputs.run_llm_compliance_policy_shadow == true
        shell: pwsh
        working-directory: praxis-config-starter
        env:
          PRAXIS_AGENTIC_AUTHORING_LLM_COMPLIANCE_POLICY: "true"
          PRAXIS_AGENTIC_AUTHORING_LLM_COMPLIANCE_FAIL_ON_PROVIDER_UNAVAILABLE: ${{ inputs.fail_llm_compliance_on_provider_unavailable }}
          PRAXIS_AGENTIC_AUTHORING_SHADOW_PROVIDER: ${{ inputs.provider }}
          PRAXIS_AI_PROVIDER: ${{ inputs.provider }}
        run: mvn -B "-Dtest=AgenticAuthoringLlmCompliancePolicyIntegrationTest" test

      - name: Run page-builder agentic E2E gate
        if: inputs.run_page_builder_full_e2e == true
        shell: pwsh
        working-directory: praxis-config-starter
        timeout-minutes: ${{ fromJSON(inputs.page_builder_e2e_timeout_minutes) }}
        run: |
          .\tools\Invoke-PbAgenticFullE2E.ps1 `
            -Provider '${{ inputs.provider }}' `
            -JavaHome "$env:JAVA_HOME" `
            -QuickstartRoot "$env:GITHUB_WORKSPACE\praxis-api-quickstart" `
            -MetadataRoot "$env:GITHUB_WORKSPACE\praxis-metadata-starter" `
            -UiRoot "$env:GITHUB_WORKSPACE\praxis-ui-angular" `
            -EnvFile "$env:GITHUB_WORKSPACE\praxis-config-starter\.env.openai.local.ps1" `
            -StartupTimeoutSec ([int]'${{ inputs.quickstart_startup_timeout_seconds }}') `
            -UiStartupTimeoutSec ([int]'${{ inputs.page_builder_ui_startup_timeout_seconds }}') `
            -ValidationMode '${{ inputs.page_builder_e2e_mode }}'

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentic-authoring-smoke-artifacts
          path: |
            artifacts/ai-sse-smoke/**
            praxis-config-starter/target/agentic-authoring/**
            artifacts/page-builder-agentic-e2e/**
            praxis-config-starter/artifacts/page-builder-agentic-e2e/**
            praxis-api-quickstart/logs/**
            praxis-ui-angular/test-results/**
            praxis-ui-angular/tools/e2e/playwright/playwright-agentic-production-like-report/**
          if-no-files-found: ignore
