name: Domain Catalog PostgreSQL Migration

on:
  pull_request:
    paths:
      - '.github/workflows/domain-catalog-postgres-migration.yml'
      - 'src/main/java/org/praxisplatform/config/domain/DomainCatalogRelease.java'
      - 'src/main/java/org/praxisplatform/config/repository/DomainCatalogReleaseRepository.java'
      - 'src/main/resources/db/migration/**'
      - 'src/test/java/org/praxisplatform/config/repository/DomainCatalogScopePostgresMigrationTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate_and_verify_scope:
    name: Flyway V1-V31 and scoped release identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: praxis_config_migration_test
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis -d praxis_config_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PostgreSQL migration proof
        env:
          POSTGRES_TEST_EPHEMERAL: 'true'
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/praxis_config_migration_test
          POSTGRES_TEST_USER: praxis
          POSTGRES_TEST_PASSWORD: praxis
        run: mvn -B "-Dtest=DomainCatalogScopePostgresMigrationTest" test
