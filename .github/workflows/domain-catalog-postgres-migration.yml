name: Domain Catalog PostgreSQL Migration

on:
  pull_request:
    paths:
      - '.github/workflows/domain-catalog-postgres-migration.yml'
      - 'src/main/java/org/praxisplatform/config/rag/RagVectorStoreService.java'
      - 'src/main/java/org/praxisplatform/config/service/DomainCatalogIngestionService.java'
      - 'src/main/java/org/praxisplatform/config/domain/DomainCatalogRelease.java'
      - 'src/main/java/org/praxisplatform/config/repository/DomainCatalogReleaseRepository.java'
      - 'src/main/resources/db/migration/**'
      - 'src/test/java/org/praxisplatform/config/repository/DomainCatalogRagPublicationPostgresMigrationTest.java'
      - 'src/test/java/org/praxisplatform/config/repository/DomainCatalogScopePostgresMigrationTest.java'
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Branch, tag or commit containing the migration proof to execute.'
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  migrate_and_verify_scope:
    name: Flyway, scoped release and RAG identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: praxis_config_migration_test
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis -d praxis_config_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5

      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PostgreSQL migration and RAG identity proofs
        env:
          POSTGRES_TEST_EPHEMERAL: 'true'
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/praxis_config_migration_test
          POSTGRES_TEST_USER: praxis
          POSTGRES_TEST_PASSWORD: praxis
        run: mvn -B "-Dtest=DomainCatalogScopePostgresMigrationTest,DomainCatalogRagPublicationPostgresMigrationTest" test
