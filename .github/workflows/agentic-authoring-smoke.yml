name: Agentic Authoring HTTP Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI provider used by the quickstart HTTP smoke.'
        required: true
        default: openai
        type: choice
        options:
          - openai
          - gemini
      openai_model:
        description: 'Optional OpenAI model override for this smoke run.'
        required: false
        default: ''
        type: string
      gemini_model:
        description: 'Optional Gemini model override for this smoke run.'
        required: false
        default: ''
        type: string
      quickstart_ref:
        description: 'Immutable praxis-api-quickstart commit SHA to test against.'
        required: true
        default: b7d374a17cd4f5fc4aa31a9fd8511764772a6c75
        type: string
      config_artifact_source:
        description: 'Config artifact exercised by Quickstart: current source checkout or the exact Maven Central coordinate pinned by Quickstart.'
        required: true
        default: source-checkout
        type: choice
        options:
          - source-checkout
          - maven-central
      metadata_ref:
        description: 'Immutable praxis-metadata-starter commit SHA to install locally.'
        required: true
        default: 8f7c52a38bef3937afd030126f0ed6b0bdd49f88
        type: string
      ui_ref:
        description: 'Immutable praxis-ui-angular commit SHA used by the page-builder E2E gate.'
        required: true
        default: 6469c52f88fa1d42c3633d28b1232bbb2a8909c2
        type: string
      paid_gate_lane:
        description: 'Exclusive paid-provider lane. Keep none for deterministic validation; select exactly one live gate deliberately.'
        required: true
        default: none
        type: choice
        options:
          - none
          - http-sse
          - page-builder
          - llm-compliance
      page_builder_e2e_mode:
        description: 'Canonical Page Builder gate profile. Use smoke for release, focused modes for archetype certification, and full for deliberate matrix investigation.'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - single-table
          - crud-simple
          - master-detail
          - related-resource
          - tabs-nested
          - business-command
          - full
      page_builder_e2e_timeout_minutes:
        description: 'Timeout for the Page Builder Playwright gate step.'
        required: false
        default: '30'
        type: string
      run_quickstart_http_smoke:
        description: 'Run the quickstart agentic authoring HTTP/SSE smoke.'
        required: false
        default: true
        type: boolean
      run_domain_catalog_v2_smoke:
        description: 'Run the quickstart Domain Catalog v2 HTTP smoke.'
        required: false
        default: true
        type: boolean
      fail_llm_compliance_on_provider_unavailable:
        description: 'Fail the compliance-policy shadow when the selected provider is unavailable or quota-limited.'
        required: false
        default: false
        type: boolean
      quickstart_startup_timeout_seconds:
        description: 'Quickstart startup timeout used by HTTP smoke, domain catalog smoke and page-builder E2E.'
        required: false
        default: '180'
        type: string
      page_builder_ui_startup_timeout_seconds:
        description: 'Angular dev server startup timeout used by the page-builder E2E gate.'
        required: false
        default: '600'
        type: string

concurrency:
  group: agentic-authoring-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize-paid-gate:
    name: Approve paid provider gate
    if: inputs.paid_gate_lane != 'none'
    runs-on: ubuntu-latest
    environment: ai-paid-gates
    permissions:
      contents: read
    steps:
      - name: Record approved paid lane
        shell: bash
        run: 'echo "Approved exclusive paid gate lane: ${{ inputs.paid_gate_lane }}"'

  quickstart-http-smoke:
    name: Quickstart HTTP/SSE smoke and optional page-builder E2E
    needs: authorize-paid-gate
    if: ${{ always() && (inputs.paid_gate_lane == 'none' || needs.authorize-paid-gate.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PRAXIS_AI_OPENAI_API_KEY: ${{ secrets.PRAXIS_AI_OPENAI_API_KEY }}
      PRAXIS_AI_OPENAI_MODEL: ${{ inputs.openai_model || vars.PRAXIS_AI_OPENAI_MODEL || 'gpt-4.1-mini' }}
      PRAXIS_AI_GEMINI_API_KEY: ${{ secrets.PRAXIS_AI_GEMINI_API_KEY }}
      PRAXIS_AI_GEMINI_MODEL: ${{ inputs.gemini_model || vars.PRAXIS_AI_GEMINI_MODEL || 'gemini-2.5-flash' }}
      PRAXIS_AI_USAGE_ORIGIN_CLASS: ci-live-gate
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      CONFIG_DATASOURCE_URL: ${{ secrets.CONFIG_DATASOURCE_URL }}
      CONFIG_DATASOURCE_USERNAME: ${{ secrets.CONFIG_DATASOURCE_USERNAME }}
      CONFIG_DATASOURCE_PASSWORD: ${{ secrets.CONFIG_DATASOURCE_PASSWORD }}
    steps:
      - name: Checkout praxis-config-starter
        uses: actions/checkout@v5
        with:
          path: praxis-config-starter

      - name: Validate immutable refs and load canonical gate matrix
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $refs = @{
            quickstart = '${{ inputs.quickstart_ref }}'
            metadata = '${{ inputs.metadata_ref }}'
            ui = '${{ inputs.ui_ref }}'
          }
          foreach ($entry in $refs.GetEnumerator()) {
            if ($entry.Value -notmatch '^[0-9a-fA-F]{40}$') {
              throw "$($entry.Key) ref must be an immutable 40-character commit SHA."
            }
          }
          $matrix = Get-Content -LiteralPath tools/e2e/page-builder-agentic-gate-matrix.json -Raw | ConvertFrom-Json
          "PB_STREAM_PROCESSING_TIMEOUT_SECONDS=$($matrix.defaults.streamProcessingTimeoutSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate sanitized evidence exporter
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          .\tools\e2e\Test-ExportAgenticProductionLikeEvidence.ps1
          .\tools\Invoke-PbAgenticFullE2E.ps1 -ValidateEvidenceParsersOnly
          .\tools\Invoke-QuickstartAgenticAuthoringApplyHttpE2E.ps1 -ValidateContinuationContractOnly

      - name: Checkout praxis-api-quickstart
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-api-quickstart
          ref: ${{ inputs.quickstart_ref }}
          path: praxis-api-quickstart
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Checkout praxis-metadata-starter
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-metadata-starter
          ref: ${{ inputs.metadata_ref }}
          path: praxis-metadata-starter
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Checkout praxis-ui-angular
        if: inputs.paid_gate_lane == 'page-builder'
        uses: actions/checkout@v5
        with:
          repository: codexrodrigues/praxis-ui-angular
          ref: ${{ inputs.ui_ref }}
          path: praxis-ui-angular
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 20
        if: inputs.paid_gate_lane == 'page-builder'
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: praxis-ui-angular/package-lock.json

      - name: Prepare Quickstart runtime secret
        shell: pwsh
        run: |
          $etagSecretBytes = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $etagSecret = [Convert]::ToHexString($etagSecretBytes)
          Write-Output "::add-mask::$etagSecret"
          "PRAXIS_RESOURCE_VERSION_ETAG_SECRET=$etagSecret" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare AI env file
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          function Escape-PsSingleQuoted([string] $Value) {
            if ($null -eq $Value) {
              return ''
            }
            return $Value.Replace("'", "''")
          }
          $provider = '${{ inputs.provider }}'
          $paidGateLane = '${{ inputs.paid_gate_lane }}'
          $runQuickstartHttpSmoke = '${{ inputs.run_quickstart_http_smoke }}' -eq 'true'
          if ($paidGateLane -eq 'http-sse' -and -not $runQuickstartHttpSmoke) {
            throw 'paid_gate_lane=http-sse requires run_quickstart_http_smoke=true.'
          }
          $requiresExternalProvider = $paidGateLane -ne 'none'
          $costMode = if ($requiresExternalProvider) { 'external-provider' } else { 'deterministic' }
          "### AI cost mode: $costMode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Exclusive paid gate lane: $paidGateLane" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($paidGateLane -eq 'http-sse') {
            "- Paid journey budget: one governed-authoring-apply journey, with at most one governed continuation" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif ($paidGateLane -eq 'page-builder') {
            "- Paid journey budget: one canonical Page Builder scenario, with zero automatic retries" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif ($paidGateLane -eq 'llm-compliance') {
            "- Paid journey budget: one compliance-policy shadow" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($requiresExternalProvider -and $provider -eq 'openai' -and [string]::IsNullOrWhiteSpace($env:PRAXIS_AI_OPENAI_API_KEY)) {
            throw 'Missing required secret PRAXIS_AI_OPENAI_API_KEY for provider=openai.'
          }
          if ($requiresExternalProvider -and $provider -eq 'gemini' -and [string]::IsNullOrWhiteSpace($env:PRAXIS_AI_GEMINI_API_KEY)) {
            throw 'Missing required secret PRAXIS_AI_GEMINI_API_KEY for provider=gemini.'
          }
          @"
          `$env:PRAXIS_AI_OPENAI_API_KEY = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_OPENAI_API_KEY)'
          `$env:PRAXIS_AI_OPENAI_MODEL = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_OPENAI_MODEL)'
          `$env:PRAXIS_AI_GEMINI_API_KEY = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_GEMINI_API_KEY)'
          `$env:PRAXIS_AI_GEMINI_MODEL = '$(Escape-PsSingleQuoted $env:PRAXIS_AI_GEMINI_MODEL)'
          "@ | Set-Content -LiteralPath .env.openai.local.ps1 -Encoding UTF8

      - name: Resolve quickstart starter versions
        shell: pwsh
        working-directory: praxis-api-quickstart
        run: |
          $configVersion = mvn -q -DforceStdout help:evaluate "-Dexpression=praxis.config.version"
          if ([string]::IsNullOrWhiteSpace($configVersion)) {
            throw 'Could not resolve praxis-api-quickstart praxis.config.version.'
          }
          $metadataVersion = mvn -q -DforceStdout help:evaluate "-Dexpression=praxis.core.version"
          if ([string]::IsNullOrWhiteSpace($metadataVersion)) {
            throw 'Could not resolve praxis-api-quickstart praxis.core.version.'
          }
          "STARTER_VERSION=$configVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "METADATA_STARTER_VERSION=$metadataVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install praxis-metadata-starter locally
        shell: pwsh
        working-directory: praxis-metadata-starter
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'praxis-metadata-build'
          $archive = Join-Path $env:RUNNER_TEMP 'praxis-metadata-build.zip'
          git archive --format=zip --output="$archive" HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $buildRoot
          Push-Location $buildRoot
          try {
            mvn -q versions:set "-DnewVersion=$env:METADATA_STARTER_VERSION" -DgenerateBackupPoms=false
            mvn -B -DskipTests install
          } finally {
            Pop-Location
          }

      - name: Install praxis-config-starter locally
        if: inputs.config_artifact_source == 'source-checkout'
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'praxis-config-build'
          $archive = Join-Path $env:RUNNER_TEMP 'praxis-config-build.zip'
          git archive --format=zip --output="$archive" HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $buildRoot
          Push-Location $buildRoot
          try {
            mvn -q versions:set "-DnewVersion=$env:STARTER_VERSION" -DgenerateBackupPoms=false
            mvn -B -DskipTests install
          } finally {
            Pop-Location
          }
          $localStarterJar = Join-Path $buildRoot "target\praxis-config-starter-$env:STARTER_VERSION.jar"
          if (-not (Test-Path -LiteralPath $localStarterJar -PathType Leaf)) {
            throw "Built praxis-config-starter jar not found at '$localStarterJar'."
          }
          "LOCAL_STARTER_JAR=$localStarterJar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve published praxis-config-starter from Maven Central
        if: inputs.config_artifact_source == 'maven-central'
        shell: pwsh
        working-directory: praxis-api-quickstart
        run: |
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'praxis-config-maven-central'
          $resolution = & "$env:GITHUB_WORKSPACE\praxis-config-starter\tools\e2e\Resolve-PublishedConfigStarterArtifact.ps1" `
            -Version "$env:STARTER_VERSION" `
            -OutputRoot $downloadRoot
          $publishedJar = [string] $resolution.jarPath
          $publishedPom = [string] $resolution.pomPath

          $localCoordinate = Join-Path $HOME ".m2\repository\io\github\codexrodrigues\praxis-config-starter\$env:STARTER_VERSION"
          if (Test-Path -LiteralPath $localCoordinate) {
            Remove-Item -LiteralPath $localCoordinate -Recurse -Force
          }
          mvn -B install:install-file "-Dfile=$publishedJar" "-DpomFile=$publishedPom"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the verified Maven Central artifact into the isolated runner workspace.'
          }
          "LOCAL_STARTER_JAR=$publishedJar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "### Config artifact: Maven Central" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Coordinate: io.github.codexrodrigues:praxis-config-starter:$env:STARTER_VERSION" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Verified JAR SHA-512: $($resolution.jarSha512)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Verified POM SHA-512: $($resolution.pomSha512)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Package praxis-api-quickstart against selected Config artifact
        shell: pwsh
        working-directory: praxis-api-quickstart
        run: mvn -B -DskipTests "-Dpraxis.core.version=$env:METADATA_STARTER_VERSION" "-Dpraxis.config.version=$env:STARTER_VERSION" package

      - name: Install praxis-ui-angular dependencies
        if: inputs.paid_gate_lane == 'page-builder'
        shell: pwsh
        working-directory: praxis-ui-angular
        run: npm ci --no-audit --fund=false

      - name: Install Playwright Chromium
        if: inputs.paid_gate_lane == 'page-builder'
        shell: pwsh
        working-directory: praxis-ui-angular
        run: npx playwright install chromium

      - name: Verify immutable source checkouts remain clean
        if: inputs.paid_gate_lane == 'page-builder'
        shell: pwsh
        run: |
          $roots = @(
            'praxis-config-starter',
            'praxis-api-quickstart',
            'praxis-ui-angular'
          )
          foreach ($root in $roots) {
            $changes = @(& git -C "$env:GITHUB_WORKSPACE\$root" status --porcelain)
            if ($changes.Count -gt 0) {
              Write-Host "Dirty checkout: $root"
              $changes | ForEach-Object { Write-Host $_ }
              throw "$root changed before the production-like gate."
            }
          }
          $metadataSha = (& git -C "$env:GITHUB_WORKSPACE\praxis-metadata-starter" rev-parse HEAD).Trim()
          $metadataTreeSha = (& git -C "$env:GITHUB_WORKSPACE\praxis-metadata-starter" rev-parse 'HEAD^{tree}').Trim()
          if ($metadataSha -ne '${{ inputs.metadata_ref }}' -or $metadataTreeSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Metadata git-archive source identity does not match the immutable workflow input.'
          }
          Write-Host "Metadata will be exercised from immutable git archive: commit=$metadataSha tree=$metadataTreeSha"

      - name: Run quickstart authoring HTTP/SSE smoke suite
        if: inputs.run_quickstart_http_smoke == true
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $smokeArgs = @{
            Provider = '${{ inputs.provider }}'
            JavaHome = "$env:JAVA_HOME"
            QuickstartRoot = "$env:GITHUB_WORKSPACE\praxis-api-quickstart"
            EnvFile = "$env:GITHUB_WORKSPACE\praxis-config-starter\.env.openai.local.ps1"
            StartupTimeoutSec = [int]'${{ inputs.quickstart_startup_timeout_seconds }}'
            StreamProcessingTimeoutSeconds = [int]$env:PB_STREAM_PROCESSING_TIMEOUT_SECONDS
          }
          if ('${{ inputs.paid_gate_lane }}' -eq 'http-sse') {
            $smokeArgs.ConfirmPaidProviderRun = $true
          } else {
            $smokeArgs.DomainRuleLifecycleOnly = $true
          }
          .\tools\Invoke-QuickstartAgenticAuthoringHttpSmokeSuite.ps1 @smokeArgs

      - name: Run quickstart Domain Catalog v2 HTTP smoke
        if: inputs.run_domain_catalog_v2_smoke == true
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          .\tools\Invoke-QuickstartDomainCatalogV2HttpSmoke.ps1 `
            -JavaHome "$env:JAVA_HOME" `
            -QuickstartRoot "$env:GITHUB_WORKSPACE\praxis-api-quickstart" `
            -StartupTimeoutSec ([int]'${{ inputs.quickstart_startup_timeout_seconds }}')

      - name: Run LLM compliance-policy shadow
        if: inputs.paid_gate_lane == 'llm-compliance'
        shell: pwsh
        working-directory: praxis-config-starter
        env:
          PRAXIS_AGENTIC_AUTHORING_LLM_COMPLIANCE_POLICY: "true"
          PRAXIS_AGENTIC_AUTHORING_LLM_COMPLIANCE_FAIL_ON_PROVIDER_UNAVAILABLE: ${{ inputs.fail_llm_compliance_on_provider_unavailable }}
          PRAXIS_AGENTIC_AUTHORING_SHADOW_PROVIDER: ${{ inputs.provider }}
          PRAXIS_AI_PROVIDER: ${{ inputs.provider }}
        run: mvn -B "-Dtest=AgenticAuthoringLlmCompliancePolicyIntegrationTest" test

      - name: Run page-builder agentic E2E gate
        if: inputs.paid_gate_lane == 'page-builder'
        shell: pwsh
        working-directory: praxis-config-starter
        timeout-minutes: ${{ fromJSON(inputs.page_builder_e2e_timeout_minutes) }}
        run: |
          .\tools\Invoke-PbAgenticFullE2E.ps1 `
            -Provider '${{ inputs.provider }}' `
            -JavaHome "$env:JAVA_HOME" `
            -QuickstartRoot "$env:GITHUB_WORKSPACE\praxis-api-quickstart" `
            -MetadataRoot "$env:GITHUB_WORKSPACE\praxis-metadata-starter" `
            -ExpectedConfigVersion "$env:STARTER_VERSION" `
            -ExpectedMetadataVersion "$env:METADATA_STARTER_VERSION" `
            -UiRoot "$env:GITHUB_WORKSPACE\praxis-ui-angular" `
            -ReferenceStarterJarPath "$env:LOCAL_STARTER_JAR" `
            -ConfigArtifactSource '${{ inputs.config_artifact_source }}' `
            -EnvFile "$env:GITHUB_WORKSPACE\praxis-config-starter\.env.openai.local.ps1" `
            -StartupTimeoutSec ([int]'${{ inputs.quickstart_startup_timeout_seconds }}') `
            -UiStartupTimeoutSec ([int]'${{ inputs.page_builder_ui_startup_timeout_seconds }}') `
            -ValidationMode '${{ inputs.page_builder_e2e_mode }}' `
            -ConfirmPaidProviderRun

      - name: Build sanitized production-like evidence
        if: inputs.paid_gate_lane == 'page-builder'
        shell: pwsh
        working-directory: praxis-config-starter
        run: |
          $publicationArgs = @{
            StarterRoot = "$env:GITHUB_WORKSPACE\praxis-config-starter"
            OutputRoot = "$env:GITHUB_WORKSPACE\praxis-config-starter\artifacts\agentic-authoring-publication"
            PublicationProfile = 'page-builder'
          }
          .\tools\Export-AgenticProductionLikeEvidence.ps1 @publicationArgs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentic-authoring-smoke-artifacts
          path: |
            praxis-config-starter/artifacts/ai-sse-smoke/**/summary.json
            praxis-config-starter/artifacts/page-builder-agentic-e2e/**/result.json
            praxis-config-starter/artifacts/page-builder-agentic-e2e/**/source-audit.json
            praxis-config-starter/artifacts/agentic-authoring-publication/**
          if-no-files-found: ignore
          retention-days: 14
